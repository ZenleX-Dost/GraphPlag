  # Spark Worker 1
  # spark-worker-1:
  #   image: bitnami/spark:3.5.0
  #   environment:
  #     SPARK_MODE: worker
  #     SPARK_MASTER_URL: spark://spark-master:7077
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #   depends_on:
  #     - spark-master
  #   volumes:
  #     - ./documents:/data/documents:ro
  #   networks:
  #     - graphplag-network
  #   restart: unless-stopped

  # Spark Worker 2
  # spark-worker-2:
  #   image: bitnami/spark:3.5.0
  #   environment:
  #     SPARK_MODE: worker
  #     SPARK_MASTER_URL: spark://spark-master:7077
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #   depends_on:
  #     - spark-master
  #   volumes:
  #     - ./documents:/data/documents:ro
  #   networks:
  #     - graphplag-network
  #   restart: unless-stopped

  # Spark Worker 3
  # spark-worker-3:
  #   image: bitnami/spark:3.5.0
  #   environment:
  #     SPARK_MODE: worker
  #     SPARK_MASTER_URL: spark://spark-master:7077
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #   depends_on:
  #     - spark-master
  #   volumes:
  #     - ./documents:/data/documents:ro
  #   networks:
  #     - graphplag-network
  #   restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - graphplag-network
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - graphplag-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  milvus_data:
  minio_data:
  etcd_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  graphplag-network:
    driver: bridge
