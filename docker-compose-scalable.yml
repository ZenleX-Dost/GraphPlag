version: "3.8"

services:
  # API Gateway - FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app_scalable:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://user:pass@postgres:5432/graphplag
      MILVUS_URL: milvus://milvus:19530
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_LEVEL: info
    depends_on:
      - redis
      - postgres
      - milvus
      - elasticsearch
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - graphplag-network
    restart: unless-stopped

  # Job Queue & Caching Layer
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - graphplag-network
    restart: unless-stopped

  # Celery Worker 1
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A tasks worker --loglevel=info --concurrency=4 --hostname=worker-1@%h
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_URL: postgresql://user:pass@postgres:5432/graphplag
      MILVUS_URL: milvus://milvus:19530
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - redis
      - postgres
      - milvus
      - elasticsearch
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - graphplag-network
    restart: unless-stopped

  # Celery Worker 2
  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A tasks worker --loglevel=info --concurrency=4 --hostname=worker-2@%h
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_URL: postgresql://user:pass@postgres:5432/graphplag
      MILVUS_URL: milvus://milvus:19530
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - redis
      - postgres
      - milvus
      - elasticsearch
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - graphplag-network
    restart: unless-stopped

  # Celery Worker 3
  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A tasks worker --loglevel=info --concurrency=4 --hostname=worker-3@%h
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_URL: postgresql://user:pass@postgres:5432/graphplag
      MILVUS_URL: milvus://milvus:19530
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - redis
      - postgres
      - milvus
      - elasticsearch
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - graphplag-network
    restart: unless-stopped

  # Celery Worker 4
  worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A tasks worker --loglevel=info --concurrency=4 --hostname=worker-4@%h
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_URL: postgresql://user:pass@postgres:5432/graphplag
      MILVUS_URL: milvus://milvus:19530
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - redis
      - postgres
      - milvus
      - elasticsearch
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - graphplag-network
    restart: unless-stopped

  # Celery Flower - Task Monitoring
  # Celery Flower - Task Monitoring
  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - graphplag-network
    restart: unless-stopped

  # Vector Database - Milvus
  milvus:
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - minio
      - etcd
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphplag-network
    restart: unless-stopped

  # Milvus Dependencies - MinIO (Object Storage)
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphplag-network
    restart: unless-stopped

  # Milvus Dependencies - etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd
    networks:
      - graphplag-network
    restart: unless-stopped

  # Full-Text Search - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphplag-network
    restart: unless-stopped

  # Relational Database - PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: graphplag
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d graphplag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphplag-network
    restart: unless-stopped

  # Spark Master
  # spark-master:
  #   image: bitnami/spark:3.5.0
  #   environment:
  #     SPARK_MODE: master
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #   ports:
  #     - "7077:7077"
