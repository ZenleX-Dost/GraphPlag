---
# Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: graphplag
  labels:
    name: graphplag
    environment: production

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphplag-config
  namespace: graphplag
data:
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_URL: "postgresql://user:pass@postgres:5432/graphplag"
  MILVUS_URL: "milvus://milvus:19530"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  VECTOR_SEARCH_TOP_K: "100"
  FULLTEXT_SEARCH_TOP_K: "100"
  SIMILARITY_THRESHOLD: "0.3"

---
# Secret for database credentials
apiVersion: v1
kind: Secret
metadata:
  name: graphplag-secrets
  namespace: graphplag
type: Opaque
stringData:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "change-me-in-production"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "change-me-in-production"

---
# PersistentVolumeClaim for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: graphplag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---
# PersistentVolumeClaim for Milvus
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-pvc
  namespace: graphplag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---
# FastAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphplag-api
  namespace: graphplag
  labels:
    app: graphplag-api
    version: v2
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: graphplag-api
  template:
    metadata:
      labels:
        app: graphplag-api
        version: v2
    spec:
      containers:
      - name: api
        image: graphplag:api-v2
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: LOG_LEVEL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: REDIS_URL
        - name: POSTGRES_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: POSTGRES_URL
        - name: MILVUS_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: MILVUS_URL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: tmp
        emptyDir: {}
      - name: uploads
        emptyDir:
          sizeLimit: 50Gi

---
# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphplag-worker
  namespace: graphplag
  labels:
    app: graphplag-worker
    version: v2
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: graphplag-worker
  template:
    metadata:
      labels:
        app: graphplag-worker
        version: v2
    spec:
      containers:
      - name: worker
        image: graphplag:worker-v2
        imagePullPolicy: Always
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: CELERY_RESULT_BACKEND
        - name: POSTGRES_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: POSTGRES_URL
        - name: MILVUS_URL
          valueFrom:
            configMapKeyRef:
              name: graphplag-config
              key: MILVUS_URL
        resources:
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 4
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - tasks
            - inspect
            - active
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: graphplag-api
  namespace: graphplag
  labels:
    app: graphplag-api
spec:
  type: LoadBalancer
  selector:
    app: graphplag-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Celery Worker Service (Headless for StatefulSet discovery)
apiVersion: v1
kind: Service
metadata:
  name: graphplag-worker
  namespace: graphplag
  labels:
    app: graphplag-worker
spec:
  clusterIP: None
  selector:
    app: graphplag-worker
  ports:
  - name: celery
    port: 6379
    targetPort: 6379

---
# Horizontal Pod Autoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphplag-api-hpa
  namespace: graphplag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graphplag-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# Horizontal Pod Autoscaler for Workers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphplag-worker-hpa
  namespace: graphplag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graphplag-worker
  minReplicas: 2
  maxReplicas: 16
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
    scaleUp:
      stabilizationWindowSeconds: 0

---
# NetworkPolicy - Allow traffic within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graphplag-network-policy
  namespace: graphplag
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: graphplag
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: graphplag
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphplag-ingress
  namespace: graphplag
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.graphplag.example.com
    secretName: graphplag-tls
  rules:
  - host: api.graphplag.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphplag-api
            port:
              number: 80

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: graphplag-api
  namespace: graphplag
  labels:
    app: graphplag-api
spec:
  selector:
    matchLabels:
      app: graphplag-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Pod Disruption Budget for API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graphplag-api-pdb
  namespace: graphplag
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: graphplag-api

---
# Pod Disruption Budget for Workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graphplag-worker-pdb
  namespace: graphplag
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: graphplag-worker
